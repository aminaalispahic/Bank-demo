services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bankdemo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ./BankDemo
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=bankdemo;Username=bankuser;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: BankDemo
      Jwt__Audience: BankDemoUsers
      AdminSeed__Username: ${ADMIN_USERNAME}
      AdminSeed__Password: ${ADMIN_PASSWORD}
    depends_on:
      - db

volumes:
  pgdata: