name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  secrets-scan:
    name: GitLeaks - Detekcija tajni
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pokreni GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Pokreni Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
  sast-security-code-scan:
    name: SAST - Security Code Scan
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build sa Security Code Scan analizom
        run: |
          cd BankDemo
          dotnet build --no-incremental
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Pokreni Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'BankDemo'
          path: 'BankDemo'
          format: 'HTML'
          args: >
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Sačuvaj izvještaj kao artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
  docker-build-trivy:
    name: Docker Build + Trivy scan
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast-semgrep, sast-security-code-scan, sca-dependency-check]
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Izgradi Docker image
        run: docker build -t bankdemo-app:${{ github.sha }} ./BankDemo

      - name: Pokreni Trivy sken
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bankdemo-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Sačuvaj Trivy izvještaj
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif